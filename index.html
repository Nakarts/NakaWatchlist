<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface-2:#eef1f8;--text:#0e1220;--muted:#5b6478;--border:#e3e6f0;--primary:#ef4444;--primary-2:#f59e0b;--accent:#facc15;--ok:#16c784;--warn:#f59e0b;--danger:#ef4444;--shadow:0 10px 30px -12px rgba(20,25,50,.18);--radius:18px}
[data-theme="dark"]{--bg:#0b0f1a;--surface:#121829;--surface-2:#1a2138;--text:#eef1ff;--muted:#9aa3bd;--border:#26304a;--shadow:0 10px 40px -10px rgba(0,0,0,.6)}
[data-palette="ocean"]{--primary:#2563eb;--primary-2:#06b6d4;--accent:#22d3ee}
[data-palette="forest"]{--primary:#16a34a;--primary-2:#65a30d;--accent:#84cc16}
[data-palette="sunset"]{--primary:#f43f5e;--primary-2:#f97316;--accent:#fbbf24}
[data-palette="grape"]{--primary:#7c3aed;--primary-2:#a855f7;--accent:#ec4899}
[data-palette="fire"]{--primary:#ef4444;--primary-2:#f59e0b;--accent:#facc15}
[data-palette="mint"]{--primary:#10b981;--primary-2:#06b6d4;--accent:#34d399}
[data-palette="rose"]{--primary:#e11d48;--primary-2:#db2777;--accent:#fb7185}
[data-palette="midnight"]{--primary:#6366f1;--primary-2:#8b5cf6;--accent:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,sans-serif}
body{padding-top:env(safe-area-inset-top)}
.app{max-width:1100px;margin:0 auto;padding:14px}
header.top{display:flex;align-items:center;gap:10px;padding:6px 4px 14px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.logo svg{width:26px;height:26px}
.brand{font-weight:900;font-size:20px;line-height:1.05}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;color:var(--text);font-size:22px;line-height:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.title{font-size:18px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.chip.sm{padding:5px 10px;font-size:12px}
.btn{padding:9px 14px;border-radius:11px;border:none;font-weight:700;cursor:pointer;background:var(--surface-2);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 16px -6px var(--primary)}
.btn.ghost{background:transparent;border:1px solid var(--border)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
input,select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:10px 12px;border-radius:11px;font-size:14px;width:100%;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--primary)}
.kpi{background:linear-gradient(135deg,var(--surface),var(--surface-2));border-radius:14px;padding:12px;border:1px solid var(--border);text-align:center}
.kpi b{display:block;font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-top:2px;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{position:sticky;top:0;background:var(--surface-2);padding:10px 12px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--primary)}
thead th.sorted::after{content:attr(data-dir);margin-left:4px;font-size:9px}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td{padding:9px 12px;vertical-align:middle;font-size:13px}
.td-titre{font-weight:600}
.td-ep,.td-temps{text-align:right;font-weight:700;font-size:12px;white-space:nowrap}
.td-temps{color:var(--primary)}
.td-annee{text-align:center;color:var(--muted);font-size:12px}
.td-genre{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.b-anime{background:color-mix(in srgb,#3b82f6 18%,transparent);color:#3b82f6;border-color:color-mix(in srgb,#3b82f6 30%,transparent)}
.b-serie{background:color-mix(in srgb,#a78bfa 18%,transparent);color:#a78bfa;border-color:color-mix(in srgb,#a78bfa 30%,transparent)}
.b-film{background:color-mix(in srgb,#16c784 18%,transparent);color:#16c784;border-color:color-mix(in srgb,#16c784 30%,transparent)}
.b-fanim{background:color-mix(in srgb,#2dd4bf 18%,transparent);color:#2dd4bf;border-color:color-mix(in srgb,#2dd4bf 30%,transparent)}
.statut-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:11px;padding:4px 8px;cursor:pointer;outline:none;font-weight:600;width:auto}
.statut-select.vu{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.statut-select.encours{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.statut-select.avoir{color:var(--muted)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.iact{background:transparent;border:1px solid var(--border);border-radius:7px;width:28px;height:28px;cursor:pointer;color:var(--muted);font-size:13px;display:inline-grid;place-items:center}
.iact:hover{color:var(--primary);border-color:var(--primary)}
.iact.danger:hover{color:var(--danger);border-color:var(--danger)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.form-grid .full{grid-column:1 / -1}
.empty{text-align:center;padding:3rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:100}
.modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:760px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px;max-height:90vh;overflow:auto}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.swatch{width:36px;height:36px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.swatch.on{border-color:var(--text)}
@media(max-width:700px){
  .td-annee,.td-genre,thead th:nth-child(4),thead th:nth-child(6),td:nth-child(4),td:nth-child(6){display:none}
  table{min-width:520px}
  .brand{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>
    <div><div class="brand">Ma Watchlist<small>Films · Séries · Animés</small></div></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="addBtn" title="Ajouter">＋</button>
    <button class="icon-btn" id="themeBtn" title="Thème">◐</button>
    <button class="icon-btn" id="paletteBtn" title="Palette">◉</button>
  </header>

  <div class="card">
    <div class="kpis" id="stats"></div>
  </div>

  <div class="card">
    <input id="search" placeholder="Rechercher un titre, un genre…"/>
    <div class="row" id="ftype" style="margin-top:10px">
      <span class="sub" style="font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.1em">Type</span>
      <button class="chip sm active" data-t="all">Tous</button>
      <button class="chip sm" data-t="anime">Animé</button>
      <button class="chip sm" data-t="serie">Série</button>
      <button class="chip sm" data-t="fanim">Film d'anim.</button>
      <button class="chip sm" data-t="film">Film</button>
    </div>
    <div class="row" id="fstat" style="margin-top:8px">
      <span class="sub" style="font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.1em">Statut</span>
      <button class="chip sm active" data-s="all">Tous</button>
      <button class="chip sm" data-s="avoir">À voir</button>
      <button class="chip sm" data-s="encours">En cours</button>
      <button class="chip sm" data-s="vu">Vu</button>
    </div>
    <div class="row" id="fgenre" style="margin-top:8px">
      <span class="sub" style="font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.1em">Genre</span>
    </div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <div class="sub">Affichés : <b id="count" style="color:var(--text)">0</b></div>
      <button class="btn ghost sm" id="reset">↺ Reset</button>
    </div>
  </div>

  <div class="card" style="padding:0">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-k="t">Titre</th>
          <th data-k="ty">Type</th>
          <th data-k="ep">Ép./Dur.</th>
          <th data-k="y">Année</th>
          <th data-k="s">Statut</th>
          <th data-k="g">Genre</th>
          <th data-k="m">Temps</th>
          <th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" id="editModal"><div class="sheet">
  <h3 class="title" id="editTitle">Ajouter</h3>
  <div class="form-grid">
    <div class="full"><label>Titre</label><input id="fTitre"/></div>
    <div><label>Type</label><select id="fType">
      <option value="film">Film</option><option value="serie">Série</option>
      <option value="anime">Animé</option><option value="fanim">Film d'animation</option>
    </select></div>
    <div><label>Année</label><input id="fAnnee" type="number" min="1900" max="2100"/></div>
    <div><label>Ép./Durée (texte)</label><input id="fEp" placeholder="ex: 2h12 ou 12 ép."/></div>
    <div><label>Durée totale (minutes)</label><input id="fMin" type="number" min="0"/></div>
    <div class="full"><label>Genre (séparés par /)</label><input id="fGenre" placeholder="Action/Comédie"/></div>
  </div>
  <hr/>
  <div class="row" style="justify-content:space-between">
    <button class="btn ghost sm" id="delBtn" style="color:var(--danger)">🗑 Supprimer</button>
    <div class="row">
      <button class="btn ghost" onclick="document.getElementById('editModal').classList.remove('on')">Annuler</button>
      <button class="btn primary" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div></div>

<div class="modal" id="paletteModal"><div class="sheet">
  <h3 class="title">Palette & thème</h3>
  <div class="row" id="paletteList"></div>
  <hr/>
  <div class="row" style="justify-content:space-between"><span>Mode</span>
    <div class="row"><button class="btn sm" data-theme="light">☀ Clair</button><button class="btn sm" data-theme="dark">🌙 Nuit</button></div>
  </div>
  <hr/>
  <button class="btn primary" style="width:100%" onclick="document.getElementById('paletteModal').classList.remove('on')">Fermer</button>
</div></div>

const ITEMS_K="watchlist.items.v1";

const TLBL={anime:"Animé",serie:"Série",film:"Film",fanim:"Film d'anim."};
const PREFS_K="watchlist.prefs.v1";
const STAT_K="watchlist-status-v1";
const PALETTES=[
  {id:"fire",c:["#ef4444","#f59e0b"]},
  {id:"forest",c:["#16a34a","#65a30d"]},
  {id:"ocean",c:["#2563eb","#06b6d4"]},
  {id:"sunset",c:["#f43f5e","#f97316"]},
  {id:"grape",c:["#7c3aed","#a855f7"]},
  {id:"mint",c:["#10b981","#06b6d4"]},
  {id:"rose",c:["#e11d48","#db2777"]},
  {id:"midnight",c:["#6366f1","#8b5cf6"]},
];

function safeGet(k,fb){try{const v=localStorage.getItem(k);return v==null?fb:JSON.parse(v);}catch(e){return fb;}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let prefs=safeGet(PREFS_K,null)||{theme:"dark",palette:"fire"};
const status=safeGet(STAT_K,{})||{};
// Items persistés : seed depuis DATA si rien en storage
let items=safeGet(ITEMS_K,null);
if(!items||!Array.isArray(items)||!items.length){
  items=DATA.map((d,i)=>({id:"seed_"+i,t:d[0],ty:d[1],ep:d[2],m:d[3],y:d[4],g:d[5]}));
  safeSet(ITEMS_K,items);
}
function saveItems(){safeSet(ITEMS_K,items);}
const state={type:"all",stat:"all",genre:null,q:"",sortK:"t",sortD:1};
let editingId=null;

function savePrefs(){safeSet(PREFS_K,prefs)}
function applyTheme(){document.documentElement.dataset.theme=prefs.theme;document.documentElement.dataset.palette=prefs.palette;const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',prefs.theme==='dark'?'#0b0f1a':'#f5f7fb')}

function getStat(id){return status[id]||"avoir"}
function setStat(id,v){status[id]=v;safeSet(STAT_K,status)}
function fmtH(m){if(!m)return"0h";const h=Math.floor(m/60),mn=m%60;return mn?h+"h"+String(mn).padStart(2,"0"):h+"h"}

function allGenres(){const s=new Set();items.forEach(d=>d.g.split("/").forEach(g=>s.add(g.trim())));return [...s].sort()}

function renderGenres(){
  const c=document.getElementById("fgenre");
  c.querySelectorAll(".chip").forEach(x=>x.remove());
  allGenres().forEach(g=>{
    const b=document.createElement("button");b.className="chip sm"+(state.genre===g?" active":"");b.textContent=g;b.dataset.g=g;
    b.onclick=()=>{state.genre=state.genre===g?null:g;renderGenresActive();render();};
    c.appendChild(b);
  });
}
function renderGenresActive(){document.querySelectorAll("#fgenre .chip").forEach(b=>b.classList.toggle("active",b.dataset.g===state.genre))}

function render(){
  const tb=document.getElementById("tbody"),q=state.q.toLowerCase().trim();
  let rows=items.map(d=>({id:d.id,t:d.t,ty:d.ty,ep:d.ep,m:d.m,y:d.y,g:d.g,s:getStat(d.id)}))
    .filter(r=>(state.type==="all"||r.ty===state.type)
      &&(state.stat==="all"||r.s===state.stat)
      &&(!state.genre||r.g.split("/").map(x=>x.trim()).includes(state.genre))
      &&(!q||r.t.toLowerCase().includes(q)||r.g.toLowerCase().includes(q)));
  rows.sort((a,b)=>{const k=state.sortK;let va=a[k],vb=b[k];if(typeof va==="string"){va=va.toLowerCase();vb=vb.toLowerCase();}return va<vb?-state.sortD:va>vb?state.sortD:0;});
  document.getElementById("count").textContent=rows.length;
  if(!rows.length){tb.innerHTML='<tr><td colspan="8" class="empty">Aucun résultat</td></tr>';}
  else{
    tb.innerHTML=rows.map(r=>`<tr>
      <td class="td-titre">${escapeHtml(r.t)}</td>
      <td><span class="badge ${TYPES[r.ty]}">${TLBL[r.ty]}</span></td>
      <td class="td-ep">${escapeHtml(r.ep)}</td>
      <td class="td-annee">${r.y}</td>
      <td><select class="statut-select ${r.s}" data-id="${r.id}">
        <option value="avoir"${r.s==="avoir"?" selected":""}>À voir</option>
        <option value="encours"${r.s==="encours"?" selected":""}>En cours</option>
        <option value="vu"${r.s==="vu"?" selected":""}>Vu</option>
      </select></td>
      <td class="td-genre">${escapeHtml(r.g)}</td>
      <td class="td-temps">${fmtH(r.m)}</td>
      <td><div class="row-actions"><button class="iact" data-edit="${r.id}" title="Modifier">✎</button></div></td>
    </tr>`).join("");
    tb.querySelectorAll("select").forEach(sel=>sel.onchange=e=>{setStat(e.target.dataset.id,e.target.value);render();renderStats();});
    tb.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  }
  document.querySelectorAll("thead th").forEach(th=>{const k=th.dataset.k;if(!k)return;th.classList.toggle("sorted",k===state.sortK);if(k===state.sortK)th.dataset.dir=state.sortD>0?"▲":"▼";else th.removeAttribute("data-dir");});
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function renderStats(){
  const tot=items.length;
  const c=t=>items.filter(d=>d.ty===t).length;
  const vus=items.filter(d=>getStat(d.id)==="vu");
  const enc=items.filter(d=>getStat(d.id)==="encours").length;
  const mins=vus.reduce((s,d)=>s+(d.m||0),0);
  document.getElementById("stats").innerHTML=`
    <div class="kpi"><b>${tot}</b><span>Total</span></div>
    <div class="kpi"><b>${c("anime")}</b><span>Animés</span></div>
    <div class="kpi"><b>${c("serie")}</b><span>Séries</span></div>
    <div class="kpi"><b>${c("fanim")}</b><span>Films anim.</span></div>
    <div class="kpi"><b>${c("film")}</b><span>Films</span></div>
    <div class="kpi"><b>${vus.length}</b><span>Vus</span></div>
    <div class="kpi"><b>${enc}</b><span>En cours</span></div>
    <div class="kpi"><b>${fmtH(mins)}</b><span>Temps vu</span></div>`;
}

// ===== Modal édition =====
function openEdit(id){
  editingId=id;
  const it=items.find(x=>x.id===id);
  document.getElementById("editTitle").textContent=it?"Modifier":"Ajouter";
  document.getElementById("fTitre").value=it?it.t:"";
  document.getElementById("fType").value=it?it.ty:"film";
  document.getElementById("fAnnee").value=it?it.y:new Date().getFullYear();
  document.getElementById("fEp").value=it?it.ep:"";
  document.getElementById("fMin").value=it?it.m:0;
  document.getElementById("fGenre").value=it?it.g:"";
  document.getElementById("delBtn").style.display=it?"inline-block":"none";
  document.getElementById("editModal").classList.add("on");
}
document.getElementById("addBtn").onclick=()=>openEdit(null);
document.getElementById("editModal").addEventListener("click",e=>{if(e.target.id==="editModal")e.target.classList.remove("on")});
document.getElementById("saveBtn").onclick=()=>{
  const t=document.getElementById("fTitre").value.trim();
  if(!t){alert("Titre requis");return;}
  const data={
    t,ty:document.getElementById("fType").value,
    y:+document.getElementById("fAnnee").value||new Date().getFullYear(),
    ep:document.getElementById("fEp").value.trim(),
    m:+document.getElementById("fMin").value||0,
    g:document.getElementById("fGenre").value.trim()||"Autre"
  };
  if(editingId){const i=items.findIndex(x=>x.id===editingId);if(i>=0)items[i]={...items[i],...data};}
  else{data.id="u_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);items.push(data);}
  saveItems();
  document.getElementById("editModal").classList.remove("on");
  renderGenres();renderStats();render();
};
document.getElementById("delBtn").onclick=()=>{
  if(!editingId)return;
  if(!confirm("Supprimer définitivement cet élément ?"))return;
  items=items.filter(x=>x.id!==editingId);
  delete status[editingId];safeSet(STAT_K,status);
  saveItems();
  document.getElementById("editModal").classList.remove("on");
  renderGenres();renderStats();render();
};

document.getElementById("ftype").addEventListener("click",e=>{if(!e.target.dataset.t)return;state.type=e.target.dataset.t;document.querySelectorAll("#ftype .chip").forEach(p=>p.classList.toggle("active",p.dataset.t===state.type));render();});
document.getElementById("fstat").addEventListener("click",e=>{if(!e.target.dataset.s)return;state.stat=e.target.dataset.s;document.querySelectorAll("#fstat .chip").forEach(p=>p.classList.toggle("active",p.dataset.s===state.stat));render();});
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;render();});
document.getElementById("reset").addEventListener("click",()=>{state.type="all";state.stat="all";state.genre=null;state.q="";document.getElementById("search").value="";document.querySelectorAll("#ftype .chip").forEach(p=>p.classList.toggle("active",p.dataset.t==="all"));document.querySelectorAll("#fstat .chip").forEach(p=>p.classList.toggle("active",p.dataset.s==="all"));renderGenresActive();render();});
document.querySelectorAll("thead th").forEach(th=>{if(!th.dataset.k)return;th.onclick=()=>{const k=th.dataset.k;if(state.sortK===k)state.sortD*=-1;else{state.sortK=k;state.sortD=1;}render();};});

document.getElementById("themeBtn").onclick=()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';savePrefs();applyTheme();};
document.getElementById("paletteBtn").onclick=()=>{document.getElementById('paletteModal').classList.add('on');};
document.getElementById("paletteModal").addEventListener("click",e=>{if(e.target.id==='paletteModal')e.target.classList.remove('on')});

(function initPalettes(){
  const c=document.getElementById("paletteList");
  PALETTES.forEach(p=>{
    const s=document.createElement("div");s.className="swatch"+(prefs.palette===p.id?" on":"");
    s.style.background=`linear-gradient(135deg,${p.c[0]},${p.c[1]})`;
    s.title=p.id;s.onclick=()=>{prefs.palette=p.id;savePrefs();applyTheme();document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));s.classList.add('on');};
    c.appendChild(s);
  });
  document.querySelectorAll('#paletteModal [data-theme]').forEach(b=>b.onclick=()=>{prefs.theme=b.dataset.theme;savePrefs();applyTheme();});
})();

applyTheme();renderGenres();renderStats();render();
</script>
</body>
</html>
